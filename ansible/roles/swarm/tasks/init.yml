---
# Volontairement en commandes docker "brutes"

- name: État Swarm du nœud
  ansible.builtin.command: docker info --format {% raw %}'{{ .Swarm.LocalNodeState }}'{% endraw %}
  register: swarm_state
  changed_when: false

- name: docker swarm init
  ansible.builtin.command: >
    docker swarm init
    --advertise-addr {{ private_ip }}
    --listen-addr {{ private_ip }}:2377
  when: swarm_state.stdout != 'active'
  changed_when: true

- name: Récupérer le token worker
  ansible.builtin.command: docker swarm join-token -q worker
  register: worker_token
  changed_when: false
  no_log: true

- name: Récupérer le token manager
  ansible.builtin.command: docker swarm join-token -q manager
  register: manager_token
  changed_when: false
  no_log: true

- name: Mémoriser les tokens pour les autres nœuds
  ansible.builtin.set_fact:
    swarm_worker_token: "{{ worker_token.stdout }}"
    swarm_manager_token: "{{ manager_token.stdout }}"
  no_log: true
